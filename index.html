<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9-sinf fizika — Mavzular</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#17233a;--mut:#5a6782;--line:#dde3ee;--acc:#1769aa;--tint:#e8f0fa}
@media (prefers-color-scheme:dark){:root{--bg:#0f1626;--card:#18223a;--ink:#e8edf8;--mut:#9fb0cf;--line:#2b3957;--acc:#5aa9f0;--tint:#22304f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:row}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
#bar h1{font-size:1rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{border:1px solid var(--line);background:var(--tint);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-size:.9rem;cursor:pointer}
#bar button:disabled{opacity:.4;cursor:default}
#menuBtn{display:none}
iframe{flex:1;width:100%;border:0;background:#fff}
aside{width:300px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
aside h2{margin:0;padding:14px 16px;font-size:1rem;border-bottom:1px solid var(--line)}
#list{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
#list button{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:.92rem;cursor:pointer;line-height:1.3}
#list button:hover{border-color:var(--acc)}
#list button .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--tint);color:var(--acc);font-weight:700;display:grid;place-items:center;font-size:.85rem}
#list button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#list button.on .n{background:#fff3;color:#fff}
#shade{display:none}
@media (max-width:760px){
 #menuBtn{display:block}
 aside{position:fixed;top:0;right:0;bottom:0;width:min(86vw,320px);z-index:20;transform:translateX(100%);transition:transform .2s}
 body.open aside{transform:none}
 body.open #shade{display:block;position:fixed;inset:0;background:#0006;z-index:10}
}

.quarter-separator{margin:14px 0 8px;padding:12px 16px;border-radius:14px;background:#5aa9ee;color:#fff;font-weight:800;letter-spacing:.04em;text-align:center}
#vp{position:fixed;left:10px;right:10px;bottom:10px;max-width:560px;margin:auto;z-index:30;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 24px #0006}#vp[hidden]{display:none}#vp a{color:var(--acc);border:1px solid var(--line);border-radius:8px;padding:10px;text-decoration:none;background:var(--bg)}#vp button{border:1px solid var(--line);background:var(--tint);color:var(--ink);border-radius:8px;padding:8px;font:inherit}#tabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}#tabs button{border:1px solid var(--line);background:var(--tint);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:.82rem;cursor:pointer}#tabs button.on{background:var(--acc);color:#fff}
</style>
</head>
<body>
<div id="main">
 <div id="bar">
  <button id="prev" aria-label="Oldingi">‹</button>
  <h1 id="cur"></h1>
  <button id="next" aria-label="Keyingi">›</button>
  <button id="menuBtn">☰ Mavzular</button>
 </div>
 <iframe id="view" title="Mavzu"></iframe>
</div>
<div id="shade"></div>
<aside>
 <h2>📚 Mavzular ro'yxati</h2>
 <div id="tabs"></div><div id="list"></div><div style="padding:10px;font-size:.8rem;color:var(--mut);border-top:1px solid var(--line)">Muallif: Madaminova Sohibaxon<br>Qo‘qon davlat universiteti, Tabiiy fanlar va iqtisodiyot fakulteti, Fizika va astronomiya yo‘nalishi, 01/23-guruh talabasi</div>
</aside>
<script>
const T=[{"n":1,"t":"Modda tuzilishining molekulyar-kinetik nazariyasi","h":"<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>9-sinf fizika — Molekulyar-kinetik nazariya<\/title>\n<style>\nbody{font-family:Arial,sans-serif;margin:0;background:#eef5ff;color:#17324d}\nheader{background:#1769aa;color:white;padding:22px;text-align:center}\nmain{max-width:950px;margin:auto;padding:18px}\nsection{background:white;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 3px 12px #0001}\nh2{color:#1769aa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}\n.card{background:#f5f9ff;padding:14px;border-radius:10px}\ncanvas{width:100%;height:280px;background:#10263a;border-radius:12px}\n.controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\nbutton,select,input{padding:9px;border-radius:8px;border:1px solid #aac}\nbutton{background:#1769aa;color:white;cursor:pointer}\n.question{margin:10px 0;padding:10px;background:#f5f9ff;border-radius:8px}\n.correct{color:green;font-weight:bold}.wrong{color:#c00;font-weight:bold}\n<\/style>\n<\/head>\n<body><details style=\"max-width:760px;margin:10px auto;padding:14px;border:2px solid #5aa9f0;border-radius:8px;font:16px system-ui,sans-serif\"><summary style=\"cursor:pointer\"><b>🎥 Video darslar (YouTube)<\/b><\/summary><div style=\"font-size:.9rem;opacity:.8;margin:4px 0\">Mavzuni hayotiy tajribalar bilan oson tushuntiruvchi videolar:<\/div><\/section><\/body><\/html>\n"},{"n":70,"t":"4-ChSB (40 ball) — nazorat","h":"<!doctype html><html lang=\"uz\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>4-ChSB · Fizika 9-sinf (40 ball)<\/title><\/head><body>\n<style>:root{--bg:#f1f8f6;--card:#fff;--ink:#14303b;--mut:#587079;--acc:#2447c9;--ok:#17855a;--bad:#d6453d;--hl:#ffe08a;--ln:#c9dcd9}\n@media(prefers-color-scheme:dark){:root{--bg:#0f1e24;--card:#16282f;--ink:#e3f0ee;--mut:#92aeb0;--acc:#7da2ff;--ok:#4cd39a;--bad:#ff7b72;--hl:#6b5514;--ln:#2a444b}}\n*{box-sizing:border-box}.on{outline:3px solid var(--hl)}.wd,.pl{margin:4px 4px 0 0}.bl{padding:4px 10px;margin:0 3px}.zn{border:2px dashed var(--ink);border-radius:6px;padding:8px;margin:6px 0;min-height:48px}.hs svg{width:100%;height:auto;border:1px solid var(--ln);border-radius:6px;color:var(--ink)}.hz{cursor:pointer}.hz.sel{stroke:var(--bad)!important;stroke-opacity:1!important}.lk label{margin:0 6px;white-space:nowrap}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}\nmain{max-width:760px;margin:auto;padding:16px}h1{font:700 1.4rem Georgia,serif;margin:6px 0}\n.q{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:14px;margin:18px 0;box-shadow:4px 4px 0 var(--ink)}\n.q h2{font:700 1.05rem Georgia,serif;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}\n.pt{font:600 .8rem system-ui;background:var(--hl);padding:2px 9px;border-radius:99px;height:fit-content;white-space:nowrap}\n.ty{font-size:.78rem;color:var(--mut);margin-bottom:6px}.o{display:block;padding:7px 10px;margin:5px 0;border:1.5px solid var(--ln);border-radius:6px;cursor:pointer}\n.o:has(input:checked){border-color:var(--acc);background:var(--hl)}\nselect,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:6px 8px;max-width:100%}\ntextarea{width:100%;min-height:80px}.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row>span{flex:1 1 200px}\nbutton{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer}button.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}\n.fb{margin-top:8px;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}.ex{font-weight:400;color:var(--mut);font-size:.92rem}\n#tot{position:sticky;bottom:0;background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:10px;text-align:center;font-weight:700;margin-top:10px}\n.seq .o{display:flex;justify-content:space-between;cursor:default}<\/style>\n<main><h1 id=\"H\"><\/h1><p class=\"ex\" id=\"D\"><\/p><div id=\"Q\"><\/div>\n<div id=\"tot\"><button id=\"chk\">Tekshirish<\/button> <button class=\"alt\" id=\"rst\">Qayta boshlash<\/button><div id=\"sc\"><\/div><\/div><\/main>\n<script>\nconst META={\"title\": \"4-ChSB · Fizika 9-sinf (40 ball)\", \"desc\": \"4-chorak yakuniy nazorati: to‘la ichki qaytish, linzalar, optik asboblar, ko‘z, Quyosh energiyasi, fizik manzara. Jami 40 ball.\"},QS=[{\"k\": \"n\", \"p\": 4, \"t\": \"Absolyut sindirish ko‘rsatkichi 2 bo‘lgan muhit uchun chegaraviy burchak necha gradus?\", \"ans\": 30, \"u\": \"°\", \"tol\": 0, \"x\": \"sinα₀ = 1/n = 0,5 ⇒ 30°.\"}, {\"k\": \"n\", \"p\": 5, \"t\": \"Linzaning optik kuchi 5 dptr. Fokus masofasi necha cm?\", \"ans\": 20, \"u\": \"cm\", \"tol\": 0, \"x\": \"F = 1/D = 0,2 m.\"}, {\"k\": \"hs\", \"p\": 4, \"t\": \"Yig‘uvchi linzaning bosh fokuslarini belgilang (ikkalasi).\", \"svg\": \"<svg viewBox=\\\"0 0 300 160\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"2\\\"><line x1=\\\"10\\\" y1=\\\"80\\\" x2=\\\"290\\\" y2=\\\"80\\\"/><ellipse cx=\\\"150\\\" cy=\\\"80\\\" rx=\\\"8\\\" ry=\\\"50\\\"/><circle class=\\\"hz\\\" data-h=\\\"d1\\\" cx=\\\"50\\\" cy=\\\"80\\\" r=\\\"10\\\" fill=\\\"#5aa9f0\\\" fill-opacity=\\\".3\\\"/><circle class=\\\"hz\\\" data-h=\\\"f1\\\" cx=\\\"100\\\" cy=\\\"80\\\" r=\\\"10\\\" fill=\\\"#5aa9f0\\\" fill-opacity=\\\".3\\\"/><circle class=\\\"hz\\\" data-h=\\\"f2\\\" cx=\\\"200\\\" cy=\\\"80\\\" r=\\\"10\\\" fill=\\\"#5aa9f0\\\" fill-opacity=\\\".3\\\"/><circle class=\\\"hz\\\" data-h=\\\"d2\\\" cx=\\\"250\\\" cy=\\\"80\\\" r=\\\"10\\\" fill=\\\"#5aa9f0\\\" fill-opacity=\\\".3\\\"/><text x=\\\"92\\\" y=\\\"110\\\" fill=\\\"currentColor\\\" stroke=\\\"none\\\">F<\/text><text x=\\\"192\\\" y=\\\"110\\\" fill=\\\"currentColor\\\" stroke=\\\"none\\\">F<\/text><text x=\\\"40\\\" y=\\\"110\\\" fill=\\\"currentColor\\\" stroke=\\\"none\\\">2F<\/text><text x=\\\"240\\\" y=\\\"110\\\" fill=\\\"currentColor\\\" stroke=\\\"none\\\">2F<\/text><\/svg>\", \"ans\": [\"f1\", \"f2\"], \"x\": \"Fokuslar linzadan F masofada.\"}, {\"k\": \"fw\", \"p\": 4, \"t\": \"Quyosh batareyasi yorug‘likni __ energiyaga, kollektor esa __ energiyaga aylantiradi.\", \"w\": [\"elektr\", \"issiqlik\", \"mexanik\"], \"ans\": [0, 1]}, {\"k\": \"do\", \"p\": 5, \"t\": \"Tasvirlarni turi bo‘yicha guruhlang.\", \"z\": [\"Haqiqiy tasvir\", \"Mavhum tasvir\"], \"i\": [\"Proyektor ekranidagi\", \"Lupadagi\", \"Ko‘zning to‘r pardasidagi\", \"Tekis ko‘zgudagi\"], \"ans\": [0, 1, 0, 1]}, {\"k\": \"mt\", \"p\": 4, \"t\": \"Kattalikni birligi bilan moslang.\", \"l\": [\"Optik kuch\", \"Fokus masofasi\", \"Sindirish ko‘rsatkichi\", \"Yorug‘lik tezligi\"], \"r\": [\"m/s\", \"dptr\", \"o‘lchamsiz\", \"m\"], \"ans\": [1, 3, 2, 0]}, {\"k\": \"n\", \"p\": 6, \"t\": \"F = 0,1 m, jism linzadan 0,15 m da. Tasvirgacha masofa necha cm?\", \"ans\": 30, \"u\": \"cm\", \"tol\": 1, \"x\": \"1/f = 10 − 6,67 = 3,33 ⇒ f = 0,3 m.\"}, {\"k\": \"tf\", \"p\": 3, \"t\": \"Fizika qonunlari butun olamda bir xil amal qiladi.\", \"ans\": 0, \"x\": \"\"}, {\"k\": \"a\", \"p\": 2, \"t\": \"Optik kuch birligi nomini yozing.\", \"ans\": [\"dioptriya\", \"dptr\", \"dpt\"], \"x\": \"1 dptr = 1/m.\"}, {\"k\": \"e\", \"p\": 3, \"t\": \"Esse. Fizikaning texnika taraqqiyotidagi o‘rnini 2–3 gapda yozing.\", \"ans\": \"Fizik qonunlar asosida elektr, aloqa, optika, tibbiyot asboblari va quyosh energetikasi yaratildi; O‘zbekistonda ham fizik tadqiqotlar texnologiyalarni rivojlantiradi.\"}, {\"k\": \"lk\", \"p\": 0, \"t\": \"O‘zingizni baholang.\", \"rows\": [\"Test savollarini tushundim\", \"Mavzuni yaxshi o‘zlashtirdim\", \"Masalalarni mustaqil yecha olaman\"]}];\nconst $=(s,e=document)=>e.querySelector(s),sel=(opts,cls='')=>`<select class=\"${cls}\"><option value=\"\">—<\/option>${opts.map((o,i)=>`<option value=\"${i}\">${o}<\/option>`).join('')}<\/select>`;\nconst norm=s=>String(s).trim().toLowerCase().replace(/[\\s,]+/g,m=>m.includes(',')?'.':' ').replace(/['’‘`ʻʼ]/g,'');\nH.textContent=META.title;D.textContent=META.desc;\nconst TY={c:'Bitta to‘g‘ri javobni tanlang',m:'Bir nechta to‘g‘ri javobni belgilang',tf:'To‘g‘ri / Noto‘g‘ri',a:'Qisqa javob',n:'Sonli javob',s:'To‘g‘ri ketma-ketlikni o‘rnating (1 dan boshlab)',mt:'Moslikni o‘rnating',f:'Bo‘sh joylarni to‘ldiring (ro‘yxatdan tanlash)',fw:'So‘zlarni bo‘sh joylarga qo‘ying: so‘zni bosing, so‘ng bo‘sh joyni bosing',do:'Obyektlarni mos joyga qo‘ying: obyektni bosing, so‘ng joyni bosing',hs:'Rasmda to‘g‘ri sohani bosib belgilang (bir nechta bo‘lishi mumkin)',lk:'Shkala: 1 — mutlaqo rozi emasman … 5 — to‘la roziman',fi:'Bo‘sh joylarni yozib to‘ldiring',e:'Esse — javobingizni yozing, so‘ng namuna bilan solishtirib o‘zingizni baholang'};\nfunction draw(){Q.innerHTML=QS.map((q,i)=>{let b='';\n if(q.k=='c'||q.k=='m')b=q.o.map((x,j)=>`<label class=\"o\"><input type=\"${q.k=='c'?'radio':'checkbox'}\" name=\"q${i}\" value=\"${j}\"> ${x}<\/label>`).join('');\n if(q.k=='tf')b=['To‘g‘ri','Noto‘g‘ri'].map((x,j)=>`<label class=\"o\"><input type=\"radio\" name=\"q${i}\" value=\"${j}\"> ${x}<\/label>`).join('');\n if(q.k=='a')b='<input type=\"text\" placeholder=\"Javob…\">';\n if(q.k=='n')b=`<input type=\"number\" step=\"any\" placeholder=\"Son\"> ${q.u||''}`;\n if(q.k=='s')b='<div class=\"seq\">'+q.o.map((x,j)=>`<div class=\"o\"><span>${x}<\/span>${sel(q.o.map((_,t)=>t+1),'sq')}<\/div>`).join('')+'<\/div>';\n if(q.k=='mt')b=q.l.map((x,j)=>`<div class=\"row\"><span>${x}<\/span>${sel(q.r,'mq')}<\/div>`).join('');\n if(q.k=='f')b=q.t.split('__').map((x,j)=>j<q.b.length?`${x}${sel(q.b[j].o,'fq')}`:x).join('');\n if(q.k=='fw')b=q.t.split('__').map((x,j)=>j<q.ans.length?x+'<button class=\"alt bl\" data-v=\"\">______<\/button>':x).join('')+'<div>'+q.w.map((x,j)=>`<button class=\"alt wd\" data-w=\"${j}\">${x}<\/button>`).join('')+'<\/div>';\n if(q.k=='fi')b=q.t.split('__').map((x,j)=>j<q.ans.length?x+'<input type=\"text\" class=\"fi\" size=\"8\">':x).join('');\n if(q.k=='do')b=q.z.map((z,j)=>`<div class=\"zn\" data-z=\"${j}\"><b>${z}<\/b><div class=\"zi\"><\/div><\/div>`).join('')+'<div>'+q.i.map((x,j)=>`<button class=\"alt wd\" data-w=\"${j}\">${x}<\/button>`).join('')+'<\/div>';\n if(q.k=='hs')b='<div class=\"hs\">'+q.svg+'<\/div>';\n if(q.k=='lk')b='<div class=\"lk\">'+q.rows.map((x,j)=>`<div class=\"row\"><span>${x}<\/span><span>${[1,2,3,4,5].map(v=>`<label><input type=\"radio\" name=\"q${i}_${j}\" value=\"${v}\">${v}<\/label>`).join('')}<\/span><\/div>`).join('')+'<\/div>';\n if(q.k=='e')b='<textarea><\/textarea><div class=\"ex\" hidden><\/div>'+`<div class=\"row\"><span>O‘z balingiz (0–${q.p}):<\/span><input type=\"number\" min=\"0\" max=\"${q.p}\" value=\"0\" style=\"width:80px\"><\/div>`;\n return `<section class=\"q\" data-i=\"${i}\"><h2><span>${i+1}-savol<\/span><span class=\"pt\">${q.p} ball<\/span><\/h2><div class=\"ty\">${TY[q.k]}<\/div><p>${['f','fw','fi'].includes(q.k)?'':q.t}<\/p>${['f','fw','fi'].includes(q.k)?'<p>'+b+'<\/p>':b}<div class=\"fb\"><\/div><\/section>`}).join('');$('#sc').textContent='';}\nQ.onclick=ev=>{const t=ev.target.closest('.wd,.bl,.pl,.hz,.zn');if(!t)return;const e=t.closest('.q'),q=QS[e.dataset.i],ch=j=>e.querySelector(`.wd[data-w=\"${j}\"]`);\n if(t.classList.contains('wd')){e.querySelectorAll('.wd').forEach(x=>x.classList.remove('on'));t.classList.add('on');e._w=t.dataset.w;return}\n if(t.classList.contains('hz')){t.classList.toggle('sel');return}\n if(t.classList.contains('pl')){ch(t.dataset.w).hidden=false;t.remove();return}\n if(t.classList.contains('bl')){if(t.dataset.v!==''&&e._w===undefined){ch(t.dataset.v).hidden=false;t.dataset.v='';t.textContent='______';return}\n  if(e._w!==undefined){if(t.dataset.v!=='')ch(t.dataset.v).hidden=false;t.dataset.v=e._w;t.textContent=q.w[e._w];ch(e._w).hidden=true;e._w=undefined}return}\n if(t.classList.contains('zn')&&e._w!==undefined){const b=document.createElement('button');b.className='alt pl';b.dataset.w=e._w;b.textContent=q.i[e._w];t.querySelector('.zi').appendChild(b);ch(e._w).hidden=true;e._w=undefined}};\nfunction grade(q,e){const v=x=>e.querySelectorAll(x);let r=0;\n if(q.k=='c'||q.k=='tf'){const c=e.querySelector('input:checked');r=c&&+c.value==q.ans?1:0}\n if(q.k=='m'){const c=[...v('input')].map(x=>x.checked?1:0),a=q.o.map((_,j)=>q.ans.includes(j)?1:0);r=c.every((x,j)=>x==a[j])?1:0}\n if(q.k=='a'){const x=norm(e.querySelector('input').value);r=q.ans.map(norm).includes(x)?1:0}\n if(q.k=='n'){const s=e.querySelector('input').value;r=s!==''&&Math.abs(+s-q.ans)<=(q.tol||0)+1e-9?1:0}\n if(q.k=='s'){const c=[...v('.sq')].map(x=>x.value);r=c.filter((x,j)=>x!==''&&+x+1==q.ans[j]).length/q.o.length}\n if(q.k=='mt'){const c=[...v('.mq')].map(x=>x.value);r=c.filter((x,j)=>x!==''&&+x==q.ans[j]).length/q.l.length}\n if(q.k=='f'){const c=[...v('.fq')].map(x=>x.value);r=c.filter((x,j)=>x!==''&&+x==q.b[j].a).length/q.b.length}\n if(q.k=='fw'){r=[...v('.bl')].filter((x,j)=>x.dataset.v!==''&&+x.dataset.v==q.ans[j]).length/q.ans.length}\n if(q.k=='fi'){r=[...v('.fi')].filter((x,j)=>q.ans[j].map(norm).includes(norm(x.value))).length/q.ans.length}\n if(q.k=='do'){r=[...v('.pl')].filter(x=>q.ans[x.dataset.w]==x.closest('.zn').dataset.z).length/q.i.length}\n if(q.k=='hs'){const z=[...v('.hz.sel')].map(x=>x.dataset.h),g=z.filter(x=>q.ans.includes(x)).length-z.filter(x=>!q.ans.includes(x)).length;r=Math.max(0,g/q.ans.length)}\n if(q.k=='lk')r=1;\n if(q.k=='e'){r=Math.min(q.p,Math.max(0,+e.querySelector('input[type=number]').value||0))/q.p;const x=e.querySelector('.ex');x.hidden=false;x.innerHTML='<b>Namuna javob:<\/b> '+q.ans}\n return r}\n$('#chk').onclick=()=>{let s=0,m=0;document.querySelectorAll('.q').forEach(e=>{const q=QS[e.dataset.i],r=grade(q,e),g=+(r*q.p).toFixed(1);s+=g;m+=q.p;\n const f=e.querySelector('.fb');f.className='fb '+(r==1?'ok':r>0?'':'bad');f.innerHTML=(q.k=='lk'?'✔ Qayd etildi':r==1?'✔ To‘g‘ri':r>0?'◐ Qisman':'✘ Noto‘g‘ri')+` — ${g}/${q.p} ball`+(q.x&&q.k!='e'?`<div class=\"ex\">${q.x}<\/div>`:'')});\n const pc=s/m*100;$('#sc').textContent=`Natija: ${+s.toFixed(1)} / ${m} ball (${Math.round(pc)}%) — baho: ${pc>=86?5:pc>=71?4:pc>=55?3:2}`};\n$('#rst').onclick=draw;draw();\n<\/script><\/body><\/html>"}];
const list=document.getElementById('list'),view=document.getElementById('view'),cur=document.getElementById('cur');
const prev=document.getElementById('prev'),next=document.getElementById('next');
let idx=-1;
const quarterNames={"1": "1-CHORAK", "19": "2-CHORAK", "34": "3-CHORAK", "55": "4-CHORAK"};
const topicButtons=[];
T.forEach((t,i)=>{
  if(quarterNames[t.n]){
    const q=document.createElement('div');
    q.className='quarter-separator';
